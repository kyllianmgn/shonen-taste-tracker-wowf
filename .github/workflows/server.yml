name: server

# Every PR and push to main: lint, unit + e2e tests, build, and a Docker image build (not pushed).
# A server-v<version> tag also pushes the image to GHCR (path filters do not apply to tag pushes).
on:
  push:
    branches: [main]
    tags: ["server-v*"]
    paths:
      - "server/**"
      - "contract/**"
      - "tools/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "contract/**"
      - "tools/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: forever
          POSTGRES_PASSWORD: forever # CI only, not a secret
          POSTGRES_DB: forever
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forever -d forever"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://forever:forever@localhost:5432/forever_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: fake-client tests
        run: node --test
        working-directory: tools/fake-client
      - run: npm run test:e2e
      - run: npm run build
      - name: compiled server loads its Prisma client
        run: node -e "require('./dist/generated/prisma/client')"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forever-tracker-server"
          tags="$image:sha-${GITHUB_SHA::7}"
          push=false
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            version="${GITHUB_REF#refs/tags/server-v}"
            pkg=$(node -p "require('./server/package.json').version")
            # The tag must match server/package.json, except test tags: server-v<version>-<suffix>.
            if [[ "$version" != "$pkg" && "$version" != "$pkg"-* ]]; then
              echo "::error::tag server-v$version does not match server/package.json version $pkg"
              exit 1
            fi
            tags="$tags,$image:$version"
            if [[ "$version" != *-* ]]; then tags="$tags,$image:latest"; fi
            push=true
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "$tags (push=$push)"
      - uses: docker/setup-buildx-action@v3
      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
