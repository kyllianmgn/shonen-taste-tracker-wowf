name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "contract/**"
      - "tools/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "contract/**"
      - "tools/**"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: forever
          POSTGRES_PASSWORD: forever # CI only, not a secret
          POSTGRES_DB: forever
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forever -d forever"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://forever:forever@localhost:5432/forever_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
