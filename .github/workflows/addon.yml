name: addon

on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "contract/**"
      - ".github/workflows/addon.yml"
  pull_request:
    paths:
      - "addon/**"
      - "contract/**"
      - ".github/workflows/addon.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: addon/tests/requirements.txt
      - run: python -m pip install -r addon/tests/requirements.txt
      - run: python -m pytest addon/tests
