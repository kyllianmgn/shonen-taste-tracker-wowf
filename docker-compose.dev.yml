# Development database only. Production stack lives in docker-compose.yml (S-21).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: forever   # dev only, not a secret
      POSTGRES_DB: forever
    ports:
      - "5432:5432"
    volumes:
      - ft-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever -d forever"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ft-pgdata-dev:
